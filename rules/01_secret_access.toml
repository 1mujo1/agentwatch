
name = "Secret access"
description = "The agent touched a secrets file (.env, SSH keys, cloud credentials)."
severity = "medium"
risk_score = 47
tags = ["AW-SECRETS"]
type = "match"

[[match]]          # kernel: the .env file watch fired (any program, any method)
source = "audit"
kind = "secret"

[[match]]          # agent: a tool call mentions a secrets file
source = "agent"
kind = "tool"
field = "input"
pattern = '(\.env\b|\.ssh/|credentials)'
